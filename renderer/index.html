<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Keen</title>
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/layout.css">
  <link rel="stylesheet" href="styles/components.css">
  <script src="../storage/time.js"></script>
  <script type="module" src="app.js"></script>
</head>
<body>
  <div class="shell" id="shell">
    <aside class="sidebar" aria-label="Main navigation">
      <a class="brand" href="#" aria-label="Keen home" data-view="today">
        <span class="brand-mark" aria-hidden="true">K</span>
        <span class="brand-name">Keen</span>
      </a>
      <nav class="side-nav" aria-label="Main">
        <button class="nav-item" type="button" data-view="today" aria-label="Today" title="Today">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2"></rect><path d="M7.5 3.5v3M16.5 3.5v3M3.5 9.5h17M8 13h3M8 16h6"></path></svg>
          <span class="nav-label">Today</span>
        </button>
        <button class="nav-item" type="button" data-view="week" aria-label="Week" title="Week">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V9M10 19V5M16 19v-7M22 19H2"></path></svg>
          <span class="nav-label">Week</span>
        </button>
        <button class="nav-item" type="button" data-view="projects" aria-label="Projects" title="Projects">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 7.5h7l2 2h8v9a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"></path><path d="M3.5 7.5v-2a2 2 0 0 1 2-2h4l2 2"></path></svg>
          <span class="nav-label">Projects</span>
        </button>
        <button class="nav-item" type="button" data-view="dashboard" aria-label="Dashboard" title="Dashboard">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"></rect><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"></rect><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"></rect><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"></rect></svg>
          <span class="nav-label">Dashboard</span>
        </button>
      </nav>
      <div class="sidebar-bottom">
        <button class="nav-item" type="button" data-view="settings" aria-label="Settings" title="Settings">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Z"></path><path d="m19.4 15 .1.1a1.8 1.8 0 0 1-2.5 2.5l-.1-.1a1.8 1.8 0 0 0-3 .9v.2a1.8 1.8 0 0 1-3.6 0v-.2a1.8 1.8 0 0 0-3-.9l-.1.1a1.8 1.8 0 0 1-2.5-2.5l.1-.1a1.8 1.8 0 0 0-.9-3h-.2a1.8 1.8 0 0 1 0-3.6h.2a1.8 1.8 0 0 0 .9-3l-.1-.1a1.8 1.8 0 0 1 2.5-2.5l.1.1a1.8 1.8 0 0 0 3-.9v-.2a1.8 1.8 0 0 1 3.6 0v.2a1.8 1.8 0 0 0 3 .9l.1-.1a1.8 1.8 0 0 1 2.5 2.5l-.1.1a1.8 1.8 0 0 0 .9 3h.2a1.8 1.8 0 0 1 0 3.6h-.2a1.8 1.8 0 0 0-.9 3Z"></path></svg>
          <span class="nav-label">Settings</span>
        </button>
        <p class="sidebar-caption">A little more focus, every day.</p>
      </div>
    </aside>

    <main class="content-area">
      <header class="page-header">
        <div>
          <p class="eyebrow">YOUR WORKSPACE</p>
          <h1 id="page-title">Today</h1>
          <p class="page-subtitle" id="page-subtitle"></p>
        </div>
        <div class="header-actions">
          <button class="button button-secondary mobile-week" type="button" data-view="week">Week summary</button>
          <button class="icon-button mobile-settings" type="button" data-view="settings" aria-label="Open settings" title="Settings">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Z"></path><path d="M19.2 14.8a1.7 1.7 0 0 0 .8-1.4 1.7 1.7 0 0 0-.8-1.4 1.7 1.7 0 0 1-.7-2 1.7 1.7 0 0 0-.6-1.9 1.7 1.7 0 0 0-2-.1 1.7 1.7 0 0 1-2.1-.4 1.7 1.7 0 0 0-2 0 1.7 1.7 0 0 1-2.1.4 1.7 1.7 0 0 0-2 .1 1.7 1.7 0 0 0-.6 1.9 1.7 1.7 0 0 1-.7 2 1.7 1.7 0 0 0-.8 1.4 1.7 1.7 0 0 0 .8 1.4 1.7 1.7 0 0 1 .7 2 1.7 1.7 0 0 0 .6 1.9 1.7 1.7 0 0 0 2 .1 1.7 1.7 0 0 1 2.1.4 1.7 1.7 0 0 0 2 0 1.7 1.7 0 0 1 2.1-.4 1.7 1.7 0 0 0 2-.1 1.7 1.7 0 0 0 .6-1.9 1.7 1.7 0 0 1 .7-2Z"></path></svg>
          </button>
        </div>
      </header>
      <p class="sync-message" id="sync" role="status" aria-live="polite"></p>
      <section id="view" aria-label="Workspace content"></section>
    </main>

    <aside class="detail-panel" id="detail-panel" aria-label="Task details" hidden></aside>
  </div>

  <nav class="bottom-nav" aria-label="Main navigation">
    <button class="bottom-nav-item" type="button" data-view="today" aria-label="Today">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2"></rect><path d="M7.5 3.5v3M16.5 3.5v3M3.5 9.5h17M8 13h3M8 16h6"></path></svg>
      <span>Today</span>
    </button>
    <button class="bottom-nav-item" type="button" data-view="projects" aria-label="Projects">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 7.5h7l2 2h8v9a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"></path><path d="M3.5 7.5v-2a2 2 0 0 1 2-2h4l2 2"></path></svg>
      <span>Projects</span>
    </button>
    <button class="bottom-nav-item" type="button" data-view="dashboard" aria-label="Stats">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"></rect><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"></rect><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"></rect><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"></rect></svg>
      <span>Stats</span>
    </button>
  </nav>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden>
    <span id="toast-message"></span>
    <button class="toast-undo" id="toast-undo" type="button" hidden>Undo</button>
    <button class="toast-close" id="toast-close" type="button" aria-label="Dismiss notification">×</button>
  </div>
  <dialog class="command-dialog" id="command-dialog" aria-labelledby="command-title">
    <div class="command-heading">
      <h2 id="command-title">Go to</h2>
      <kbd>ESC</kbd>
    </div>
    <input class="text-input command-input" id="command-input" type="search" placeholder="Search pages…" autocomplete="off" aria-label="Search pages">
    <div class="command-list" id="command-list">
      <button class="command-option" type="button" data-command-view="today"><span>Today</span><kbd>T</kbd></button>
      <button class="command-option" type="button" data-command-view="week"><span>Week</span></button>
      <button class="command-option" type="button" data-command-view="projects"><span>Projects</span></button>
      <button class="command-option" type="button" data-command-view="dashboard"><span>Dashboard</span></button>
      <button class="command-option" type="button" data-command-view="settings"><span>Settings</span></button>
    </div>
    <p class="command-hint">Use ↑ ↓ to navigate · Enter to open</p>
    <p class="command-empty" id="command-empty" hidden>No pages match that search.</p>
  </dialog>
</body>
</html>
